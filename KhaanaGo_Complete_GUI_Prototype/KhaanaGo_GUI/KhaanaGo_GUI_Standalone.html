function itemDetail(){const f=S.item;return `${foodpic(f.emoji,'yellow')}<div class="mt16">${badge('Verified nutrition','info')} <span style="float:right">♡</span></div><h1 class="mt12">${f.name}</h1><p class="muted smalltext mt8">${f.desc}</p><h2 class="mt16">${fmt(f.price)}</h2><div class="grid cols2 mt16"><div class="card tight"><div class="smalltext muted">Energy</div><b>${f.kcal} kcal</b></div><div class="card tight"><div class="smalltext muted">Prep time</div><b>${f.time} min</b></div></div><div class="mt12">${notice('⚠ Contains: '+f.allergens,'warn')}</div><div class="mt16">${btn('Customize this item','customize','primary fullw')}<div class="mt8">${btn('Add without changes','add-item','ghost fullw')}</div></div>`}
function customize(){const f=S.item;return `${heading('Make it yours',f.name)}${foodpic(f.emoji,'yellow')}<div class="mt16"><h3>Choose portion</h3><div class="grid cols2 mt8"><button class="tileoption selected" data-action="select-option"><b>Regular</b><p>Included</p></button><button class="tileoption" data-action="select-option"><b>Large</b><p>+ Rs. 200</p></button></div></div><div class="mt16"><h3>Add extras</h3><label class="rec-row mt8"><input type="checkbox"/> <span class="grow semibold">Extra sauce</span> + Rs. 80</label><label class="rec-row"><input type="checkbox"/> <span class="grow semibold">Extra cheese</span> + Rs. 120</label></div>${textfield('Special instructions','e.g. Mild spice, no onions')}<div class="mt16">${btn('Add to cart · '+fmt(f.price),'add-item','primary fullw')}</div>`}
function cartScreen(){return `${heading('Your cart','From '+S.restaurant.name)}${S.cart.length?S.cart.map(x=>`<div class="listing">${foodpic(x.emoji,'yellow')}<div class="grow"><b>${x.name}</b><p class="smalltext muted mt8">${fmt(x.price)} each</p><button class="btn text small" data-remove="${x.id}">Remove</button></div><div class="steppers"><button data-qty="${x.id}" data-delta="-1">−</button><b>${x.qty}</b><button data-qty="${x.id}" data-delta="1">+</button></div></div>`).join('')+`${card(`${moneyline('Subtotal',cartSub())}${moneyline('Delivery (estimated)',140)}${moneyline('Total',cartSub()+140,'total')}`,'mt16')}<div class="mt16">${btn('Continue to delivery','delivery','primary fullw')}</div>`:card(`<div style="text-align:center;padding:21px 5px"><div style="font-size:62px">🛒</div><h3>Your cart is empty</h3><p class="muted smalltext mt8">Explore kitchens and add something delicious.</p><div class="mt16">${btn('Browse food','menu')}</div></div>`)} `}
function deliveryType(){return `${heading('Delivery preference','Choose the balance of price and speed')}<div class="stack">${[['Pooled','🌿','Save money by combining nearby drop-offs','Rs. 140','May add 5–10 minutes'],['Express','⚡','Direct from the kitchen to your door','Rs. 250','Fastest available']].map(t=>`<button class="tileoption ${S.delivery===t[0]?'selected':''}" data-delivery="${t[0]}"><div class="row between"><b>${t[1]} ${t[0]} delivery</b>${badge(t[3],t[0]==='Pooled'?'ok':'neutral')}</div><p>${t[2]}</p><p>${t[4]}</p></button>`).join('')}</div>${notice('Pooled delivery is disabled for fragile/custom cakes in real fulfilment.','warn')}<div class="mt16">${btn('Choose delivery slot','slot','primary fullw')}</div>`}
function slotSelect(){let slots=[['12:30','Full'],['13:00','Available'],['13:30','Limited'],['14:00','Available'],['14:30','Available'],['15:00','Limited'],['15:30','Available'],['16:00','Available'],['16:30','Full']];return `${heading('When should it arrive?','Slots are based on real kitchen load')}<div class="chips mb16">${['Today','Tomorrow','Saturday'].map(d=>`<button class="chip ${S.day===d?'active':''}" data-day="${d}">${d}</button>`).join('')}</div><h3>Available delivery windows</h3><div class="slotgrid mt12">${slots.map(([t,v])=>`<button class="slotbtn ${v==='Limited'?'lim':v==='Full'?'full':''} ${S.slot===t?'selected':''}" data-slot="${t}" ${v==='Full'?'disabled':''}><b>${t}</b><small>${v}</small></button>`).join('')}</div><div class="mt16">${notice('☂ Rain-aware preparation buffer is included in these estimates.')}</div><div class="card tight mt16"><div class="row between"><span class="smalltext muted">Selected arrival window</span><b>${S.slot}–${String(Number(S.slot.split(':')[0])).padStart(2,'0')}:45</b></div><div class="row between mt8"><span class="smalltext muted">Kitchen availability</span>${badge('Confirmed upon checkout','ok')}</div></div><div class="mt16">${btn('Continue to payment','payment','primary fullw')}</div>`}
function paymentMethod(){return `${heading('Payment method','Secure and transparent checkout')}<div class="stack">${[['Cash on delivery','💵','Pay your rider when food arrives'],['Online card','💳','Card checkout — integration pending'],['Wallet','📱','Local digital payment — integration pending']].map(t=>`<button class="tileoption ${S.payment===t[0]?'selected':''}" data-payment="${t[0]}"><div class="row between"><b>${t[1]} ${t[0]}</b>${S.payment===t[0]?badge('Selected','ok'):''}</div><p>${t[2]}</p></button>`).join('')}</div>${card(`${moneyline('Items',cartSub())}${moneyline('Delivery',S.delivery==='Express'?250:140)}${moneyline('Total due',cartTotal(),'total')}`,'mt16')}<div class="mt16">${btn('Review your order','review','primary fullw')}</div>`}
function reviewOrder(){return `${heading('Review order','One last look before placing it')}${card(`<b>${S.restaurant.name}</b><p class="smalltext muted mt8">${S.cart.map(x=>x.qty+'× '+x.name).join(', ')||'Demo order — add a dish first'}</p><div class="hr"></div><div class="summaryline"><span>📍 Address</span><b style="font-size:10px;text-align:right;max-width:160px">${S.savedAddress}</b></div><div class="summaryline"><span>🕐 Delivery</span><b>${S.day} ${S.slot}</b></div><div class="summaryline"><span>🛵 Delivery type</span><b>${S.delivery}</b></div><div class="summaryline"><span>💳 Payment</span><b>${S.payment}</b></div>`)}<div class="mt12">${btn('🎟 Apply a voucher','voucher','ghost fullw')}</div>${card(`${moneyline('Subtotal',cartSub())}${moneyline('Delivery',S.delivery==='Express'?250:140)}${S.voucher?moneyline('Voucher discount',-150):''}${moneyline('Total',cartTotal(),'total')}`,'mt12')}<div class="mt16">${btn('Place order · '+fmt(cartTotal()),'place-order','primary fullw')}</div><p class="smalltext muted mt12">Prototype only — no charge is made.</p>`}
function orderPlaced(){return `<div style="text-align:center;padding:26px 0"><div style="font-size:80px">🎉</div><h1>Your order is placed!</h1><p class="muted mt12">The kitchen has received your order and reserved your selected capacity slot.</p><div class="mt16">${badge('#KG-1043','orange')}</div></div>${card(`<div class="row between"><span class="muted">Estimated delivery</span><b>${S.day} ${S.slot}</b></div><div class="hr"></div><div class="row between"><span class="muted">Order status</span>${badge('Accepted','ok')}</div>`)}<div class="mt16">${btn('Track your order','track','primary fullw')}</div><div class="mt8">${btn('Back to home','home','ghost fullw')}</div>`}
function tracking(){let stages=[['Order placed','Your order has been confirmed'],['Preparing','Kitchen has started preparing your food'],['Almost ready','Rider assignment synchronized with kitchen'],['Picked up','Rider is heading to you'],['Delivered','Enjoy your meal!']];return `${heading('Your order is on the way','#KG-1043 · '+S.restaurant.name)}<div class="card tight mb16" style="background:#252525;color:#fff"><div class="row between"><div><p style="font-size:10px;color:#e4c9b0">ESTIMATED ARRIVAL</p><h1 style="font-size:25px;margin-top:5px">${S.slot}–${String((+S.slot.split(':')[0])+1).padStart(2,'0')}:00</h1></div><span style="font-size:36px">🛵</span></div><p style="font-size:10px;color:#e1b995;margin-top:8px">Kitchen capacity accounted for • ${S.delivery} delivery</p></div><div class="route-map mb16"><span class="map-pin a">🍳 Kitchen</span><span class="map-pin b">🏠 You</span></div>${card(`<div class="cardtitle"><h3>Order progress</h3>${badge(stages[Math.min(S.orderStatus,4)][0],'info')}</div><div class="timeline">${stages.map((t,i)=>`<div class="timeline-item ${i<S.orderStatus?'done':i===S.orderStatus?'current':''}"><span class="timeline-dot">${i<S.orderStatus?'✓':''}</span><div><b>${t[0]}</b><p>${t[1]}</p></div></div>`).join('')}</div>`)}<div class="mt16">${btn('Simulate next status ›','next-status','ghost fullw')}</div><div class="mt8">${btn('Why was my ETA changed?','delay','text fullw')}</div>`}
function orderHistory(){return `${heading('My orders','Order again or view invoices')}${[['#KG-1043','Today · 1:00 PM','Preparing','Rs. 1,440'],['#KG-0962','Yesterday · 7:45 PM','Delivered','Rs. 1,980'],['#KG-0904','20 Oct · 6:30 PM','Delivered','Rs. 650']].map(o=>`<button class="listing" data-nav="E17-US2-UI2"><div class="avatar">🍜</div><div class="grow"><b>${o[0]} · Spice Route</b><p class="smalltext muted">${o[1]}</p><div class="mt8">${badge(o[2],o[2]==='Delivered'?'ok':'info')}</div></div><b>${o[3]}</b></button>`).join('')}`}
function orderDetail(){return `${heading('Order #KG-1043','Receipt and itemized charges')}${card(`<div class="row between"><b>Spice Route Kitchen</b>${badge('Preparing','info')}</div><div class="hr"></div>${S.cart.length?S.cart.map(x=>moneyline(x.qty+' × '+x.name,x.qty*x.price)).join(''):moneyline('Chicken Biryani',650)}${moneyline('Delivery fee',140)}${moneyline('Total',cartTotal()||790,'total')}`)}<div class="mt16">${btn('Track order','track','primary fullw')}</div><div class="mt8">${btn('Rate this order','rate','ghost fullw')}</div>`}
function ratingScreen(){return `${heading('Rate your experience','Ratings are separate for kitchen and rider')}<div class="card" style="text-align:center"><div style="font-size:50px">⭐</div><h3 class="mt12">How was the food?</h3><div style="font-size:32px;letter-spacing:8px;margin:17px 0">${[1,2,3,4,5].map(x=>`<button data-rating="${x}" style="background:none;border:0;font-size:28px;padding:0;color:${x<=S.rating?'#F97316':'#d6cabc'}">★</button>`).join('')}</div>${textfield('Tell us more','What did you love?')}${btn('Submit rating','submit-form','primary fullw')}</div>`}
function profileScreen(){return `${heading('My profile','Manage your details and preferences')}<div class="row mb16"><div class="avatar" style="width:57px;height:57px;border-radius:50%;font-size:22px">AK</div><div><h3>Ayesha Khan</h3><p class="smalltext muted">ayesha@example.com</p><p class="smalltext muted">+92 300 1234567</p></div></div>${[['Saved addresses','📍','E1-US5-UI2'],['Edit profile','👤','E1-US5-UI4'],['Order history','📋','E17-US2-UI1'],['My notifications','🔔','E17-US1-UI2'],['Help and support','💬','E19-US1-UI1']].map(([a,b,c])=>`<button class="listing" data-nav="${c}"><span style="font-size:20px">${b}</span><b class="grow">${a}</b>›</button>`).join('')}`}
function addresses(){return `${heading('Saved addresses','Make checkout faster')}${card(`<b>🏠 Home</b><p class="muted smalltext mt8">${S.savedAddress}</p><div class="mt12">${btn('Edit address','editaddress','ghost small')}</div>`)}<div class="mt16">${btn('+ Add another address','editaddress','primary fullw')}</div>`}
function customerAssistant(){return `${heading('KhaanaGo assistant','Ask about food, orders and delivery')}${card(`<div class="stack"><div class="rec-row"><span>🤖</span><div><b>Hi! What can I help you find?</b><p>Try “Where is my order?” or “Show vegetarian meals”.</p></div></div>${S.assistant.map(v=>`<div class="rec-row"><span>💬</span><div><b>${esc(v.question)}</b><p>${esc(v.answer)}</p></div></div>`).join('')}</div>`)}<div class="row mt16"><input class="searchinput" data-field="assistantDraft" placeholder="Ask KhaanaGo..."/><button class="btn primary" data-action="ask-assistant">➤</button></div><p class="smalltext muted mt12">Demo responses only · no live AI service connected.</p>`}

 if(/register|registration|application|documents|bank details|business profile|profile|staff|account/.test(t)&&!/list|status|review/.test(t))return `<div class="generic-fields"><div class="grid cols2">${field('Full name / business name','text','','Enter details')}${field('Mobile / contact number','tel','', '+92 3XX XXXXXXX')}${field('Email address','email','','name@example.com')}${selectfield('Account / business type',role==='Rider'?['Rider','Fleet partner']:['Restaurant','Cloud kitchen','Home baker','Vendor'])}</div>${textfield('Additional information','Enter any supporting details')}${save}</div>`;
 if(/settings|preferences|navigation|alerts|data saver|hours|configuration|rules|commission|tariff|capacity|buffer|permissions|scope|notification/.test(t))return `<div class="generic-fields">${reqs.slice(0,5).map((r,i)=>`<div class="rec-row"><div class="grow"><b>${esc(r.split('(')[0].slice(0,100))}</b><p>Configurable option ${i+1}</p></div><button class="switch ${i%2===0?'on':''}" data-action="switch-local" aria-label="Toggle setting"></button></div>`).join('')}${field('Additional setting / value','text','','Optional')}${save}</div>`;
 if(/list|queue|history|users|reports|payouts|payments|ratings|feedback|audit|invoice|refunds|analytics|performance|variance|discrepancy|complaints/.test(t))return `<div class="card"><div class="row between mb16"><b>${esc(s.title)} · demo records</b>${badge('Sample data','info')}</div><div class="tablewrap"><table class="tbl"><thead><tr><th>Reference</th><th>Details</th><th>Updated</th><th>Status</th><th>View</th></tr></thead><tbody>${['1042','1041','1040','1039'].map((id,i)=>`<tr><td><b>${role.substring(0,2).toUpperCase()}-${id}</b></td><td>${esc(reqs[i%reqs.length]||s.title).slice(0,78)}</td><td>${i+1}h ago</td><td>${badge(i%2?'Review':'Active',i%2?'lim':'ok')}</td><td><button class="btn ghost small" data-action="submit-form">View</button></td></tr>`).join('')}</tbody></table></div></div>`;
 if(/delivery|pickup|route|check-in|safety|drop-off|pooled|vehicle|fleet/.test(t))return `<div class="grid cols2"><div>${card(`<h3>Route preview</h3><div class="route-map mt12"><span class="map-pin a">Origin</span><span class="map-pin b">Destination</span></div><div class="mt12">${badge('GPS simulated','info')}</div>`)}</div><div>${card(`<h3>Delivery information</h3>${reqs.slice(0,4).map(x=>`<div class="generic-row">${esc(x)}</div>`).join('')}${btn('Confirm / continue','submit-form','primary mt16')}`)}</div></div>`;
 if(/item|ingredient|stock|recipe|offer|expense|wastage|material|edit|create|add|review|form|customization|quote|reorder/.test(t))return `<div class="generic-fields">${field('Name / reference','text','','Enter '+s.title.toLowerCase())}<div class="grid cols2">${field('Quantity / amount','number','1')}${selectfield('Status',['Active','Pending','Draft','Paused'])}</div>${textfield('Details and notes',reqs.join('; ').slice(0,150))}<div class="row wrap">${save}${btn('Cancel','back','ghost')}</div></div>`;
 if(/permission|location/.test(t))return `<div style="text-align:center;max-width:390px;margin:10px auto"><div style="font-size:55px;margin-bottom:16px">📍</div><h2>Permission required</h2><p class="muted mt12">${esc(reqs.join(' '))}</p><div class="mt16">${btn('Allow (demo)','submit-form','primary fullw')}</div></div>`;
 if(/error|failed|locked|offline|paused|expired|no access|not found/.test(t))return `${notice(esc(reqs.join(' ')),'warn')}<div class="mt16">${btn('Try again','submit-form','primary')}</div>`;
 return `<div class="generic-fields"><h3>${esc(s.title)}</h3><p class="muted smalltext mt12">${esc(s.requirements)}</p><div class="mt16">${btn('Continue','submit-form','primary')}</div></div>`;
}
function genericScreen(s){if(!s)return card('<h2>Screen unavailable</h2>');return `<div class="generic-view">${card(`<div class="row between"><div><div class="eyebrow">${s.id} · ${s.story}</div><h2>${esc(s.title)}</h2><p class="muted smalltext mt8">${esc(s.section)}</p></div>${badge(s.priority,s.priority==='P1'?'orange':'neutral')}</div><div class="hr"></div>${genericBody(s)}<div class="hr"></div><div class="row between"><b class="smalltext">Chapter 2 acceptance-criteria coverage</b>${badge('Requirement-linked','info')}</div><ul class="generic-bullets">${bullets(s).map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="smalltext muted mt16">This view is an interactive GUI scaffold for the documented ${s.kind.toLowerCase()}. Live validation, secure workflows and external integrations belong to development phases.</p>`)}</div>`}
/* ───── Navigation and simulated operations ───── */
const actionRoutes={home:'E3-US1-UI1',menu:'E3-US1-UI2',cart:'E3-US2-UI1',customize:'E4-US1-UI1',delivery:'E14-US2-UI1',slot:'E5-US3-UI1',payment:'E3-US3-UI1',review:'E3-US2-UI2',track:'E17-US1-UI1',rate:'E18-US1-UI1',filters:'E3-US1-UI5',voucher:'E3-US4-UI1',delay:'E6-US4-UI1',kitchen:'E7-US3-UI1',ticket:'E7-US1-UI2',capacity:'E5-US1-UI1','capacity-live':'E5-US1-UI3',inventory:'E9-US1-UI1',planner:'E9-US4-UI1',recipe:'E8-US1-UI2',nutrition:'E8-US2-UI1',invoices:'E10-US1-UI2',finance:'E12-US1-UI1',menulist:'E2-US2-UI1','new-item':'E2-US2-UI2',offers:'E11-US1-UI1','create-offer':'E11-US1-UI2','stock-add':'E9-US1-UI2',payouts:'E12-US1-UI2',expenses:'E12-US1-UI3',margins:'E12-US2-UI1',buffers:'E6-US3-UI1','new-buffer':'E6-US3-UI2','verify-queue':'E20-US1-UI5',offer:'E13-US2-UI4','rider-home':'E13-US2-UI2','rider-store':'E13-US4-UI1','rider-handover':'E13-US1-UI3','delivery-code':'E13-US3-UI2','rider-earnings':'E15-US3-UI1','ready-alert':'E13-US1-UI2','quick-message':'E16-US4-UI2','rider-problem':'E18-US3-UI3',editaddress:'E1-US5-UI3','voice-board':'E7-US4-UI1','new-order':'E7-US1-UI1'};
function perform(action,element){if(actionRoutes[action]){if(action==='new-order'){S.orders.unshift({id:'#KG-'+(1043+S.demoCount++),customer:'Demo customer',items:'1 × Biryani',amount:790,status:'New',minutes:0})};setScreen(actionRoutes[action]);return;}
 switch(action){
 case 'catalogue':S.showCatalogue=true;S.catalogueRole=S.role;render();return;
 case 'closecatalogue':S.showCatalogue=false;render();return;
 case 'closemodal':S.modal=null;render();return;
 case 'notifications':setScreen(S.role==='Customer'?'E17-US1-UI2':S.role==='Rider'?'E13-US1-UI2':'E9-US2-UI2');return;
 case 'add-item':addToCart(S.item.id);setScreen('E3-US2-UI1');return;
 case 'clear-search':S.search='';render();return;
 case 'select-option':document.querySelectorAll('.tileoption').forEach(x=>x.classList.remove('selected'));element.classList.add('selected');return;
 case 'place-order':if(!S.cart.length){toast('Add at least one item before checkout');setScreen('E3-US1-UI2');return};S.customerPlaced=true;S.orderStatus=1;S.orders.unshift({id:'#KG-1043',customer:'Ayesha Khan',items:S.cart.map(x=>x.qty+' × '+x.name).join(', '),amount:cartTotal(),status:'New',minutes:0});setScreen('E3-US4-UI2');return;
 case 'next-status':S.orderStatus=Math.min(4,S.orderStatus+1);toast('Order status updated (simulation)');return;
 case 'toggle-online':S.riderOnline=!S.riderOnline;toast(S.riderOnline?'You are online and available':'You are now offline');return;
 case 'accept-offer':S.riderStage=1;setScreen('E13-US1-UI1');return;
 case 'decline-offer':setScreen('E13-US2-UI2');return;
 case 'confirm-pickup':S.riderStage=2;S.orderStatus=Math.max(3,S.orderStatus);setScreen('E13-US3-UI1');return;
 case 'verify-code':{const code=document.querySelector('[data-field="code"]')?.value;if(code!=='1234'){toast('Incorrect demo code · try 1234');return;}S.riderStage=3;S.orderStatus=4;setScreen('E13-US3-UI4');return}
 case 'toggle-pause':S.paused=!S.paused;S.modal=null;toast(S.paused?'Kitchen intake paused':'Kitchen intake resumed');return;
 case 'prepare-order':{const o=S.orders.find(o=>o.id==='#KG-1042');if(o)o.status='Preparing';S.modal=null;setScreen('E7-US3-UI1');return}
 case 'order-stage':{const id=element.dataset.order||'#KG-1042',o=S.orders.find(o=>o.id===id);if(o){const st=['New','Preparing','Ready','Handed Over'];o.status=st[Math.min(3,st.indexOf(o.status)+1)];if(o.status==='Ready')S.orderStatus=Math.max(S.orderStatus,2)}toast(id+' moved to '+(o?.status||'next stage'));return}
 case 'save-capacity':{let n=Number(document.querySelector('[data-field="capacity"]')?.value);if(!n||n<1){toast('Capacity must be greater than zero');return;}S.capacity=n;toast('Kitchen capacity updated');return}
 case 'buffer-save':S.buffer=15;S.modal=null;toast('Buffer rule saved (demo)');return;
 case 'approve':S.verification='approved';S.modal=null;toast('Verification decision saved (simulation)');return;
 case 'apply-voucher':{let value=document.querySelector('[data-field="voucher"]')?.value||'WELCOME150';S.voucher=value;S.modal=null;toast('Voucher '+value+' applied (demo)');return}
 case 'submit-form':S.modal=null;toast('Saved in prototype (not submitted to a server)');return;
 case 'new-order':S.orders.unshift({id:'#KG-1043',customer:'Sample customer',items:'1 × Chicken Biryani',amount:650,status:'New',minutes:0});toast('Demo order added');return;
 case 'ask-assistant':{let textval=document.querySelector('[data-field="assistantDraft"]')?.value?.trim();if(!textval)return;S.assistant.push({question:textval,answer:/order|where|track/i.test(textval)?'Your order is preparing. The estimated slot is '+S.slot+'.':'You can browse nearby kitchens and see capacity-aware delivery slots.'});render();return}
 case 'switch-local':element.classList.toggle('on');return;
 case 'menu-filter':toast('Showing '+(element.dataset.value||'all')+' menu items');return;
 case 'favourites':toast('Favourites are saved locally in this prototype');return;
 case 'back':S.modal=null;navRole(S.role);return;
 case 'export-report':toast('Export is a prototype control — no server report generated');return;
 default:toast(action+' is represented as a GUI-only action');return;
 }
}
document.addEventListener('click',(ev)=>{
 const el=ev.target.closest('[data-action],[data-nav],[data-role],[data-vendor],[data-item],[data-filter],[data-qty],[data-slot],[data-day],[data-delivery],[data-payment],[data-rating],[data-cat-role],[data-remove]');if(!el)return;
 if(el.dataset.action){perform(el.dataset.action,el);return}
 if(el.dataset.nav){setScreen(el.dataset.nav);return}
 if(el.dataset.role){navRole(el.dataset.role);return}
 if(el.dataset.vendor!==undefined){S.restaurant=vendors[Number(el.dataset.vendor)];setScreen('E3-US1-UI2');return}
 if(el.dataset.item){S.item=foods.find(x=>x.id===Number(el.dataset.item))||foods[0];setScreen('E3-US1-UI3');return}
 if(el.dataset.filter){S.filter=el.dataset.filter;render();return}
 if(el.dataset.qty){const x=S.cart.find(x=>x.id===Number(el.dataset.qty));if(x){x.qty+=Number(el.dataset.delta);if(x.qty<=0)S.cart=S.cart.filter(c=>c!==x)}render();return}
 if(el.dataset.remove){S.cart=S.cart.filter(x=>x.id!==Number(el.dataset.remove));render();return}
 if(el.dataset.slot){S.slot=el.dataset.slot;render();return}
 if(el.dataset.day){S.day=el.dataset.day;render();return}
 if(el.dataset.delivery){S.delivery=el.dataset.delivery;render();return}
 if(el.dataset.payment){S.payment=el.dataset.payment;render();return}
 if(el.dataset.rating){S.rating=Number(el.dataset.rating);render();return}
 if(el.dataset.catRole){S.catalogueRole=el.dataset.catRole;render();return}
});
document.addEventListener('input',ev=>{
 const el=ev.target;
 if(!el.dataset.field)return;
 if(el.dataset.field==='catalogueSearch'){
  S.catalogueSearch=el.value;
  // Update only entries, preserve input focus and cursor position.
  const previous=document.activeElement;const pos=el.selectionStart;
  render();const next=document.querySelector('[data-field="catalogueSearch"]');next?.focus();next?.setSelectionRange(pos,pos);return;
 }
 if(el.dataset.field==='search'){S.search=el.value;return}
 if(el.dataset.field==='assistantDraft'){S.assistantDraft=el.value;return}
});
// Expose a tiny test hook for automated GUI verification. No secrets or network calls.
window.KhaanaGoPrototype={screenCount:ALL.length,getCurrent:()=>({...S}),navigate:setScreen,switchRole:navRole,stats};
render();
})();

</script></body></html>
